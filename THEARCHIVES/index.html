<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">

  <title>THE ARCHIVES | TRACKSTAR GALLERY</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Archives header -->
  <header class="archives-header">

    <a href="../" class="archives-logo" aria-label="Return to homepage">
     <img src="../trackstar-nonhollow.svg" alt="Trackstar">
     <span class="archives-logo-flashlight"></span>
    </a>

    <span class="archives-divider"></span>

    <span class="archives-title">THE ARCHIVES</span>

  </header>

  <!-- Archives page selector -->
  <nav class="archives-selector">
    <span class="archives-selector-active">THE ARCHIVES</span>
  </nav>

  <!-- Game collection -->
<section class="archives-games">

  <div class="archives-section-heading">
    <h2>Games</h2>
    <span>3</span>
  </div>

  <div class="archives-game-grid">

    <a href="#" class="archives-game-card">
      <div class="archives-game-image">
        <!-- Horizon Zero Dawn screenshot goes here -->
      </div>
      <div class="archives-game-info">
        <h3>Horizon Zero Dawn</h3>
        <span>PHOTOGRAPHS</span>
      </div>
    </a>

    <a href="#" class="archives-game-card">
      <div class="archives-game-image">
        <!-- Wolverine screenshot goes here -->
      </div>
      <div class="archives-game-info">
        <h3>Marvel's Wolverine</h3>
        <span>PHOTOGRAPHS</span>
      </div>
    </a>

    <a href="#" class="archives-game-card">
      <div class="archives-game-image">
        <!-- UFC 6 screenshot goes here -->
      </div>
      <div class="archives-game-info">
        <h3>UFC 6</h3>
        <span>PHOTOGRAPHS</span>
      </div>
    </a>

  </div>

</section>

</body>
</html>
