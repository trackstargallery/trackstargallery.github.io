<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Horizon Zero Dawn photography collection from TRACKSTAR GALLERY.">

  <title>Horizon Zero Dawn | THE ARCHIVES</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Sticky Archives Header -->
  <header class="archives-header">

    <a href="../" class="archives-logo" aria-label="Return to THE ARCHIVES">
      <img src="../../trackstar-nonhollow.svg" alt="Trackstar">
      <span class="archives-logo-flashlight"></span>
    </a>

    <span class="archives-divider"></span>

    <span class="archives-title">THE ARCHIVES</span>

    <!-- Photography Categories -->
    <nav class="category-tabs" aria-label="Photography categories">

      <a class="category-tab" href="#screenshots">
        Screenshots
      </a>

      <a class="category-tab" href="#day-n-nite">
        Day 'N' Nite
      </a>

    </nav>

    <a href="../" class="archives-back" aria-label="Back to THE ARCHIVES">
      <span class="archives-back-arrow"></span>
    </a>

  </header>

  <!-- Photograph Collections -->
  <main class="archives-gallery">

    <!-- SCREENSHOTS -->
    <section class="gallery-category" id="screenshots">

      <div class="archives-gallery-heading">

        <div class="archives-gallery-title">
          <h2>Screenshots</h2>
          <span class="archives-image-counter">0</span>
        </div>

        <button class="download-all" type="button">
          DOWNLOAD ALL
        </button>

      </div>

      <div class="archives-photo-grid">

        <div class="archives-photo-card">
          <img src="photographs/Hunting.jpg" alt="Hunting">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Hunting2.jpg" alt="Hunting 2">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Hunting3.jpg" alt="Hunting 3">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Battle.jpg" alt="Battle">
        </div>


      </div>

    </section>


    <!-- DAY 'N' NITE -->
    <section class="gallery-category" id="day-n-nite">

      <div class="archives-gallery-heading">

        <div class="archives-gallery-title">
          <h2>Day 'N' Nite</h2>
          <span class="archives-image-counter">0</span>
        </div>

        <button class="download-all" type="button">
          DOWNLOAD ALL
        </button>

      </div>

      <div class="archives-photo-grid">

        <div class="archives-photo-card">
          <img src="photographs/Day 'N' Nite 1.jpg" alt="Day 'N' Nite 1">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Day 'N' Nite 2.jpg" alt="Day 'N' Nite 2">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Day 'N' Nite 3.jpg" alt="Day 'N' Nite 3">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Day 'N' Nite 4.jpg" alt="Day 'N' Nite 4">
        </div>

        <div class="archives-photo-card">
          <img src="photographs/Day 'N' Nite 5.jpg" alt="Day 'N' Nite 5">
        </div>

      </div>

    </section>

  </main>

</body>
</html>
